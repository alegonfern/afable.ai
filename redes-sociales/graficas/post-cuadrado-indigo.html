<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Recoleta'; src: local('Recoleta'); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden}
  body{
    background:linear-gradient(135deg,#586AD0 0%, #2F42A6 100%);
    font-family:'Inter',sans-serif;
    position:relative;
  }
  .glow{
    position:absolute; width:900px; height:900px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 65%);
    top:-260px; right:-260px;
  }
  .brand{
    position:absolute; top:72px; left:72px;
    display:flex; align-items:center; gap:16px;
  }
  .tile{
    width:56px; height:56px; border-radius:14px;
    background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center;
  }
  .tile svg{width:60%;height:60%}
  .wordmark{
    font-family:'Sora',sans-serif; font-weight:800; font-size:28px;
    letter-spacing:-0.02em; color:#fff;
  }
  .content{
    position:absolute; left:72px; right:72px; top:390px;
  }
  h1{
    font-family:'Recoleta','Sora',sans-serif; font-weight:600;
    font-size:92px; line-height:1.04; color:#fff; letter-spacing:-0.01em;
    margin-bottom:36px;
  }
  p{
    font-family:'Inter',sans-serif; font-weight:500; font-size:30px; line-height:1.45;
    color:rgba(255,255,255,.82); max-width:820px;
  }
  .foot{
    position:absolute; left:72px; bottom:64px;
    display:flex; align-items:center; gap:14px;
  }
  .pill{
    background:#fff; color:#2F42A6; font-family:'Inter',sans-serif; font-weight:700;
    font-size:22px; padding:14px 28px; border-radius:999px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="brand">
    <div class="tile">
      <svg viewBox="0 0 512 512" fill="none" stroke="#fff">
        <circle cx="256" cy="256" r="57" stroke-width="44"/>
        <g stroke-linecap="round" stroke-width="48">
          <line x1="256" y1="137" x2="256" y2="49"/>
          <line x1="256" y1="137" x2="256" y2="49" transform="rotate(45 256 256)"/>
          <line x1="256" y1="137" x2="256" y2="49" transform="rotate(90 256 256)"/>
          <line x1="256" y1="137" x2="256" y2="49" transform="rotate(135 256 256)"/>
          <line x1="256" y1="137" x2="256" y2="49" transform="rotate(180 256 256)"/>
          <line x1="256" y1="137" x2="256" y2="49" transform="rotate(225 256 256)"/>
          <line x1="256" y1="137" x2="256" y2="49" transform="rotate(270 256 256)"/>
          <line x1="256" y1="137" x2="256" y2="49" transform="rotate(315 256 256)"/>
        </g>
      </svg>
    </div>
    <div class="wordmark">Afable</div>
  </div>
  <div class="content">
    <h1>IA para<br/>equipos.</h1>
    <p>Carga tus sistemas y tus archivos. Dale acceso a tu equipo.<br/>Afable recuerda todo lo demás.</p>
  </div>
  <div class="foot">
    <div class="pill">getafable.com</div>
  </div>
</body>
</html>
