name: Desplegar Afable
description: Compila el frontend, arma el paquete (backend/ + dist/) y lo entrega al servidor.

inputs:
  ambiente:
    description: produccion o staging
    required: true
  llave:
    description: Llave privada SSH que solo puede correr /opt/afable/bin/desplegar.sh
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Compilar el frontend
      shell: bash
      working-directory: app
      env:
        VITE_API_URL: /api/v1
      run: |
        npm ci
        npm run build

    - name: Armar el paquete
      shell: bash
      run: |
        mkdir -p paquete
        git archive HEAD backend | tar -x -C paquete
        cp -r app/build paquete/dist   # Vite compila en app/build (outDir)
        tar -czf paquete.tgz -C paquete backend dist
        ls -lh paquete.tgz

    - name: Entregar al servidor
      shell: bash
      env:
        LLAVE: ${{ inputs.llave }}
      run: |
        mkdir -p ~/.ssh
        # tr quita los \r que quedan si la llave se copió desde Windows.
        printf '%s\n' "$LLAVE" | tr -d '\r' > ~/.ssh/despliegue
        chmod 600 ~/.ssh/despliegue
        if ! ssh-keygen -y -f ~/.ssh/despliegue > /dev/null; then
          echo "::error::El secreto VPS_SSH_KEY no es una llave privada válida (vacío, incompleto o es la pública). Debe ir completo, con las líneas BEGIN y END."
          exit 1
        fi
        echo "Huella de la llave (debe ser SHA256:2CIk9xup8u+DKJ34DdOb+qId0WG9CkF/eIIzxxqPSWI):"
        ssh-keygen -lf ~/.ssh/despliegue
        echo "187.127.21.114 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIETuxPyzlImzCp9yhqyyhsqKdAy2kkj5/moDzTsRCr+f" > ~/.ssh/known_hosts
        ssh -i ~/.ssh/despliegue -o BatchMode=yes root@187.127.21.114 "${{ inputs.ambiente }} ${GITHUB_SHA}" < paquete.tgz
