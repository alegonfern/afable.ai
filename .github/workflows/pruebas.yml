# Pruebas automáticas: corren en cada push a cualquier rama y en cada pull request.
# Si algo falla, GitHub marca el commit en rojo. No despliega nada.
# En main y staging no se disparan solas: las llama despliegue.yml (así no corren dos veces).
#
# No usa claves reales: los tests no las necesitan (las llamadas a IA, correo y pagos
# están simuladas). SECRET_KEY de abajo solo existe para que Django arranque.

name: Pruebas

on:
  push:
    branches-ignore: [main, staging]
  pull_request:
  workflow_call:

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: afable
          POSTGRES_USER: afable
          POSTGRES_PASSWORD: afable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afable -d afable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: afable.settings.development
      SECRET_KEY: ci-no-es-secreto
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migraciones al día con los modelos
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --noinput --parallel 4

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build igual al de producción
        run: npm run build
        env:
          VITE_API_URL: /api/v1
